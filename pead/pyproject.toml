[project]
name = "pead"
version = "0.1.0"
description = "PEAD (Post-Earnings Announcement Drift) backtester for an equity universe"
requires-python = "==3.12.*"
dependencies = [
    "yfinance>=0.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pead*"]
